services:
  postgres-test:
    image: postgres:16-alpine
    container_name: queueflow-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: queueflow_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d queueflow_test"]
      interval: 2s
      timeout: 3s
      retries: 5
