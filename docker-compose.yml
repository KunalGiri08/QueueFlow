name: queueflow-app

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: "${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Error: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required at build time. Set it in .env or your environment.}"
    image: queueflow:latest
    container_name: queueflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
